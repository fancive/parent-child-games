<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 - 亲子游戏</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, 'PingFang SC', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e8f5e9, #fff9c4);
        text-align: center;
        padding: 24px;
        color: #333;
      }
      .emoji { font-size: 5rem; margin-bottom: 16px; }
      h1 { font-size: 1.5rem; margin-bottom: 8px; }
      p { font-size: 1rem; color: #666; margin-bottom: 24px; line-height: 1.6; }
      button {
        background: #43a047;
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: 24px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.95); }
    </style>
  </head>
  <body>
    <div class="emoji">📡</div>
    <h1>哎呀，没有网络连接</h1>
    <p>请检查网络后重试。<br />已缓存的游戏仍然可以玩哦！</p>
    <button onclick="location.reload()">重新加载</button>
  </body>
</html>
