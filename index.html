<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="适合 3-6 岁小朋友的亲子互动小游戏">
<meta name="theme-color" content="#43a047">
<link rel="manifest" href="manifest.json">
<title>亲子游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, 'Helvetica Rounded', 'Arial Rounded MT Bold', Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #e8f5e9 0%, #fff9c4 50%, #e3f2fd 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 16px;
}

h1 {
  font-size: 2.4rem;
  color: #333;
  margin-bottom: 8px;
  text-align: center;
}

.subtitle {
  font-size: 1.1rem;
  color: #888;
  margin-bottom: 40px;
  text-align: center;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
  max-width: 900px;
  width: 100%;
}

.game-card {
  background: #fff;
  border-radius: 20px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.game-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.12);
}

.game-card:active {
  transform: translateY(0);
}

.game-card .card-emoji {
  font-size: 4rem;
  line-height: 1;
}

.game-card .card-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #333;
}

.game-card .card-desc {
  font-size: 0.9rem;
  color: #999;
  line-height: 1.5;
}

.game-card .card-tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
}

.tag-ready {
  background: #e8f5e9;
  color: #43a047;
}

.tag-coming {
  background: #f5f5f5;
  color: #bbb;
}

.footer {
  margin-top: 48px;
  font-size: 0.85rem;
  color: #bbb;
}
</style>
</head>
<body>

<h1>🎮 亲子游戏</h1>
<p class="subtitle">和宝贝一起玩吧！</p>

<div class="games-grid">
  <a class="game-card" href="kitchen-game/index.html">
    <span class="card-emoji">🍳</span>
    <span class="card-title">小厨师做饭</span>
    <span class="card-desc">去超市购物、骑车回家、选食谱做出美味的菜肴！</span>
    <span class="card-tag tag-ready">可以玩啦</span>
  </a>

  <a class="game-card" href="bear-supermarket/index.html">
    <span class="card-emoji">🧸</span>
    <span class="card-title">小熊超市</span>
    <span class="card-desc">当小店员接待顾客，练习报价和简单算数！</span>
    <span class="card-tag tag-ready">可以玩啦</span>
  </a>

  <div class="game-card" style="opacity:0.5;cursor:default;">
    <span class="card-emoji">🎨</span>
    <span class="card-title">涂色画板</span>
    <span class="card-desc">选颜色给可爱的图案涂上漂亮的颜色</span>
    <span class="card-tag tag-coming">即将上线</span>
  </div>

  <div class="game-card" style="opacity:0.5;cursor:default;">
    <span class="card-emoji">🔢</span>
    <span class="card-title">数字冒险</span>
    <span class="card-desc">在游戏中认识数字和简单的加减法</span>
    <span class="card-tag tag-coming">即将上线</span>
  </div>
</div>

<p class="footer">适合 3-6 岁小朋友 ❤️</p>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
