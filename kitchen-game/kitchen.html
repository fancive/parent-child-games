<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>小厨师做饭 - 厨房</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="cook.css">
</head>
<body>

<div class="phase-bar">
  <div class="phase-dot done">🛒 超市</div>
  <div class="phase-connector"></div>
  <div class="phase-dot done">🚲 回家</div>
  <div class="phase-connector"></div>
  <div class="phase-dot active">🍳 做饭</div>
</div>

<div class="page">
  <!-- Recipe selection -->
  <div class="recipe-selection" id="recipe-selection">
    <div class="recipe-title">📖 选一道菜来做吧！</div>
    <div class="recipe-cards" id="recipe-cards"></div>
    <div style="text-align:center;padding:8px;">
      <button class="btn btn-secondary" id="btn-back-shop">🛒 回超市买更多</button>
    </div>
  </div>

  <!-- Cooking steps -->
  <div class="cooking-steps" id="cooking-steps" style="display:none">
    <div class="cooking-header">
      <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem" id="btn-change-dish">← 换菜</button>
      <div class="cooking-dish-name" id="cooking-dish-name"></div>
      <div style="width:56px"></div>
    </div>
    <div class="progress-row" id="step-progress"></div>
    <div class="step-hint" id="step-hint"></div>
    <div class="step-content" id="step-content"></div>
  </div>
</div>

<!-- Celebration -->
<div class="celebration-overlay" id="celebration-overlay">
  <div class="celeb-card">
    <div class="dish-result" id="celeb-dish"></div>
    <h2 id="celeb-title"></h2>
    <p id="celeb-msg"></p>
    <div class="stars" id="celeb-stars"></div>
    <div class="celeb-buttons">
      <button class="btn btn-primary" id="btn-cook-again">🍳 再做一道！</button>
      <button class="btn btn-secondary" id="btn-restart">🛒 重新购物！</button>
    </div>
  </div>
</div>

<script src="../shared/utils.js"></script>
<script src="shared.js"></script>
<script src="cook.js"></script>
</body>
</html>
