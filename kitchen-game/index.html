<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小厨师做饭 - 超市</title>
<link rel="stylesheet" href="shared.css">
<style>
body {
  background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 100%);
}
.page { padding-top: 56px; }

/* ===== HEADER ===== */
.shop-header {
  display: flex; align-items: center;
  justify-content: space-between; padding: 8px 16px;
}
.shop-title { font-size: 1.2rem; font-weight: 700; color: #1565c0; }

/* Wallet */
.wallet {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #fff9c4, #fff176);
  padding: 6px 16px; border-radius: 24px;
  font-size: 1.1rem; font-weight: 700; color: #f57f17;
  box-shadow: var(--shadow-sm); transition: transform 0.3s;
}
.wallet .coin { font-size: 1.3rem; }
.wallet.shake { animation: wallet-shake 0.4s ease; }
.wallet.pulse { animation: wallet-pulse 0.3s ease; }
@keyframes wallet-shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
}
@keyframes wallet-pulse {
  0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); }
}

/* Recipe book button */
.recipe-book-btn {
  display: flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, #ffe0b2, #ffcc80);
  padding: 8px 14px; border-radius: 24px;
  font-size: 0.9rem; font-weight: 700; color: #e65100;
  border: none; cursor: pointer; min-height: var(--touch-min);
  box-shadow: var(--shadow-sm);
}
.recipe-book-btn:active { transform: scale(0.95); }

/* ===== SHELVES ===== */
.shelves {
  flex: 1; overflow-y: auto;
  padding: 0 12px 12px;
  -webkit-overflow-scrolling: touch;
}
.shelf-section { margin-bottom: 12px; }
.shelf-label {
  font-size: 0.85rem; font-weight: 700; color: var(--c-brown);
  padding: 4px 10px; background: rgba(255,255,255,0.6);
  border-radius: 12px; display: inline-block; margin-bottom: 6px;
}
.shelf-items {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 10px;
}

/* Shop item */
.shop-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  padding: 12px 6px 10px;
  background: rgba(255,255,255,0.85);
  border-radius: 14px; cursor: pointer;
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
  min-height: var(--touch-min);
  /* stagger entrance */
  opacity: 0; transform: translateY(16px) scale(0.95);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.shop-item.entered { opacity: 1; transform: none; }
.shop-item:active { transform: scale(0.92) !important; }
.shop-item .item-emoji { font-size: 2.8rem; line-height: 1; transition: transform 0.3s; }
.shop-item .item-name { font-size: 0.8rem; color: #555; font-weight: 600; }
.shop-item .item-price {
  font-size: 0.7rem; color: #e65100; font-weight: 700;
  background: #fff3e0; padding: 1px 8px; border-radius: 10px;
}
.shop-item.bought { opacity: 0.35; pointer-events: none; }
.shop-item.bought .item-emoji { transform: scale(0.8); }
.shop-item.cant-afford { animation: item-shake 0.3s ease; }
@keyframes item-shake {
  0%,100% { transform: translateX(0) rotate(0); }
  25% { transform: translateX(-3px) rotate(-2deg); }
  75% { transform: translateX(3px) rotate(2deg); }
}

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255,152,0,0.3);
  transform: scale(0); pointer-events: none;
  animation: ripple-out 0.5s ease-out forwards;
}
@keyframes ripple-out { to { transform: scale(4); opacity: 0; } }

/* Flying clone */
.flying-item {
  position: fixed; font-size: 2.5rem;
  z-index: 999; pointer-events: none;
  will-change: transform, left, top;
}

/* ===== CART ===== */
.cart-area {
  background: rgba(255,255,255,0.92);
  border-top: 2px solid #e0e0e0;
  padding: 8px 12px; min-height: 100px;
}
.cart-area.bounce { animation: cart-bounce 0.35s var(--ease-bounce); }
@keyframes cart-bounce {
  0% { transform: scale(1); }
  40% { transform: scale(1.03) translateY(-2px); }
  100% { transform: scale(1); }
}
.cart-label {
  font-size: 0.8rem; color: #888; margin-bottom: 4px;
  font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.cart-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; border-radius: 10px;
  background: var(--c-orange); color: #fff;
  font-size: 0.7rem; font-weight: 700; padding: 0 4px;
}
.cart-count.pop { animation: add-pop 0.3s var(--ease-bounce); }
.cart-items {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 4px 0; min-height: 54px; align-items: center;
  -webkit-overflow-scrolling: touch;
}
.cart-items:empty::after {
  content: '购物车是空的，点击食材购买吧！';
  color: #bbb; font-size: 0.8rem;
  animation: gentle-pulse 2s ease-in-out infinite;
}
@keyframes gentle-pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

.cart-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 1px;
  padding: 4px 8px; background: #fff; border-radius: 12px;
  cursor: pointer; flex-shrink: 0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  position: relative; min-height: var(--touch-min);
  justify-content: center;
}
.cart-item:active { transform: scale(0.85); }
.cart-item .ci-emoji { font-size: 1.5rem; }
.cart-item .ci-name { font-size: 0.6rem; color: #888; }
.cart-item::after {
  content: '✕'; position: absolute; top: -4px; right: -4px;
  width: 16px; height: 16px; background: var(--c-red); color: #fff;
  font-size: 0.55rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.cart-item.entering { animation: cart-pop-in 0.4s var(--ease-bounce) forwards; }
@keyframes cart-pop-in {
  0% { transform: scale(0) rotate(-10deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.cart-item.removing { animation: cart-poof 0.3s ease-out forwards; pointer-events: none; }
@keyframes cart-poof {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15) rotate(5deg); opacity: 0.5; }
  100% { transform: scale(0); opacity: 0; }
}
.cart-actions { display: flex; justify-content: flex-end; margin-top: 6px; }

/* ===== RECIPE BOOK OVERLAY ===== */
.recipe-book {
  background: linear-gradient(135deg, #fff8e1, #ffecb3);
  border-radius: 20px; width: 92%; max-width: 500px; max-height: 85vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: bounce-in 0.35s var(--ease-overshoot);
  overflow: hidden;
}
.rb-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 2px solid rgba(0,0,0,0.08);
}
.rb-header h2 { font-size: 1.15rem; color: #e65100; }
.rb-close {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--c-red); color: #fff;
  font-size: 1.1rem; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.rb-close:active { transform: scale(0.9); }
.rb-list {
  flex: 1; overflow-y: auto; padding: 10px;
  display: flex; flex-direction: column; gap: 10px;
  -webkit-overflow-scrolling: touch;
}
.rb-card {
  background: #fff; border-radius: 14px; padding: 10px 12px;
  display: flex; gap: 10px; align-items: flex-start;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.rb-card-emoji { font-size: 2.8rem; flex-shrink: 0; line-height: 1; }
.rb-card-info { flex: 1; min-width: 0; }
.rb-card-name { font-size: 1rem; font-weight: 700; color: #333; margin-bottom: 4px; }
.rb-card-row {
  font-size: 0.8rem; color: #777; line-height: 1.6;
  display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center;
}
.rb-card-row .label { font-weight: 700; color: var(--c-text-muted); flex-shrink: 0; }
.rb-ing { display: inline-flex; align-items: center; gap: 1px; white-space: nowrap; }
.rb-ing.has { color: var(--c-green-dark); }
.rb-ing.missing { color: #bbb; }
.rb-card-cost { font-size: 0.75rem; color: var(--c-orange-dark); font-weight: 600; margin-top: 2px; }
.rb-card.can-make { border-left: 4px solid var(--c-green); }
</style>
</head>
<body>

<div class="phase-bar">
  <div class="phase-dot active">🛒 超市</div>
  <div class="phase-connector"></div>
  <div class="phase-dot">🚲 回家</div>
  <div class="phase-connector"></div>
  <div class="phase-dot">🍳 做饭</div>
</div>

<div class="page">
  <div class="shop-header">
    <div class="shop-title">🏪 超市</div>
    <button class="recipe-book-btn" id="btn-recipe">📖 食谱</button>
    <div class="wallet" id="wallet">
      <span class="coin">🪙</span>
      <span id="wallet-amount">20</span> 元
    </div>
  </div>
  <div class="shelves" id="shelves"></div>
  <div class="cart-area" id="cart-area">
    <div class="cart-label">🛒 购物车 <span class="cart-count" id="cart-count" style="display:none">0</span></div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-actions">
      <button class="btn btn-go-home" id="btn-go-home" disabled>🏠 回家做饭！</button>
    </div>
  </div>
</div>

<!-- Recipe book overlay -->
<div class="overlay-backdrop" id="recipe-book-overlay">
  <div class="recipe-book">
    <div class="rb-header">
      <h2>📖 食谱大全</h2>
      <button class="rb-close" id="btn-rb-close">✕</button>
    </div>
    <div class="rb-list" id="rb-list"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let money = 20;
let cart = [];

// ===== INIT =====
(function init() {
  if (localStorage.getItem('kitchen-back-to-shop')) {
    const state = loadGameState();
    money = state.money;
    cart = state.cart;
    localStorage.removeItem('kitchen-back-to-shop');
  }
  document.getElementById('wallet-amount').textContent = money;
  buildShelves();
  syncCartDOM();
  updateCartBadge();
  updateGoHomeBtn();

  // Event delegation
  document.getElementById('btn-go-home').addEventListener('click', goHome);
  document.getElementById('btn-recipe').addEventListener('click', openRecipeBook);
  document.getElementById('btn-rb-close').addEventListener('click', closeRecipeBook);
  document.getElementById('recipe-book-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeRecipeBook();
  });
})();

// ===== SHELVES =====
function buildShelves() {
  const shelves = document.getElementById('shelves');
  const frag = document.createDocumentFragment();
  const categories = {};
  ALL_INGREDIENTS.forEach(ing => {
    (categories[ing.category] ||= []).push(ing);
  });
  const catEmojis = { '蔬菜':'🥦', '蛋奶':'🥛', '肉类':'🥩', '主食':'🍚', '调料':'🧂' };

  let idx = 0;
  for (const [cat, items] of Object.entries(categories)) {
    const section = document.createElement('div');
    section.className = 'shelf-section';
    section.innerHTML = `<div class="shelf-label">${catEmojis[cat]||''} ${cat}</div>`;
    const grid = document.createElement('div');
    grid.className = 'shelf-items';

    for (const ing of items) {
      const el = document.createElement('div');
      el.className = 'shop-item' + (cart.includes(ing.id) ? ' bought entered' : '');
      el.dataset.id = ing.id;
      el.innerHTML = `
        <span class="item-emoji">${ing.emoji}</span>
        <span class="item-name">${ing.name}</span>
        <span class="item-price">${ing.price}元</span>`;
      el.addEventListener('click', onShopItemClick);
      // Stagger entrance
      const d = idx * 40;
      if (!cart.includes(ing.id)) {
        setTimeout(() => el.classList.add('entered'), d + 80);
      }
      grid.appendChild(el);
      idx++;
    }
    section.appendChild(grid);
    frag.appendChild(section);
  }
  shelves.appendChild(frag);
}

// Debounced buy
const onShopItemClick = debounceClick(function (e) {
  const el = this;
  const id = el.dataset.id;
  const ing = getIngredient(id);
  if (!ing || cart.includes(id)) return;

  if (money < ing.price) {
    playSound('error');
    flashClass('wallet', 'shake', 400);
    el.classList.add('cant-afford');
    setTimeout(() => el.classList.remove('cant-afford'), 300);
    return;
  }

  money -= ing.price;
  cart.push(id);
  playSound('buy');
  document.getElementById('wallet-amount').textContent = money;
  flashClass('wallet', 'pulse', 300);

  // Ripple
  spawnRipple(el, e);

  // Fly to cart
  flyToCart(ing, el);

  // Mark bought
  el.classList.add('bought');
  updateGoHomeBtn();
}, 200);

function spawnRipple(el, e) {
  const rect = el.getBoundingClientRect();
  const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
  const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.cssText = `left:${x}px;top:${y}px;width:40px;height:40px;margin:-20px 0 0 -20px;`;
  el.appendChild(r);
  setTimeout(() => r.remove(), 500);
}

function flyToCart(ing, fromEl) {
  const fromRect = fromEl.getBoundingClientRect();
  const cartRect = document.getElementById('cart-area').getBoundingClientRect();
  const clone = document.createElement('div');
  clone.className = 'flying-item';
  clone.textContent = ing.emoji;
  const sx = fromRect.left + fromRect.width / 2 - 20;
  const sy = fromRect.top;
  const tx = cartRect.left + cartRect.width / 2 - 20;
  const ty = cartRect.top + 10;
  clone.style.left = sx + 'px';
  clone.style.top = sy + 'px';
  document.body.appendChild(clone);

  const dur = 400;
  const start = performance.now();
  (function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    const ease = 1 - (1 - p) ** 3;
    clone.style.left = (sx + (tx - sx) * ease) + 'px';
    clone.style.top = (sy + (ty - sy) * ease - 70 * Math.sin(p * Math.PI)) + 'px';
    clone.style.transform = `scale(${1 - p * 0.5}) rotate(${p * 360}deg)`;
    clone.style.opacity = 1 - p * 0.3;
    if (p < 1) return requestAnimationFrame(tick);
    clone.remove();
    appendCartItem(ing.id);
    flashClass('cart-area', 'bounce', 350);
  })(performance.now());
}

// ===== CART =====
function appendCartItem(id) {
  const ing = getIngredient(id);
  const el = document.createElement('div');
  el.className = 'cart-item entering';
  el.dataset.id = id;
  el.innerHTML = `<span class="ci-emoji">${ing.emoji}</span><span class="ci-name">${ing.name}</span>`;
  el.addEventListener('click', onCartItemClick);
  document.getElementById('cart-items').appendChild(el);
  setTimeout(() => el.classList.remove('entering'), 400);
  updateCartBadge();
}

const onCartItemClick = debounceClick(function () {
  const el = this;
  const id = el.dataset.id;
  const idx = cart.indexOf(id);
  if (idx === -1) return;

  playSound('return');
  el.classList.add('removing');
  setTimeout(() => {
    el.remove();
    const ing = getIngredient(id);
    cart.splice(idx, 1);
    money += ing.price;
    document.getElementById('wallet-amount').textContent = money;
    flashClass('wallet', 'pulse', 300);
    // Un-gray shop item
    const shopEl = document.querySelector(`.shop-item[data-id="${id}"]`);
    if (shopEl) shopEl.classList.remove('bought');
    updateCartBadge();
    updateGoHomeBtn();
  }, 300);
}, 350);

function syncCartDOM() {
  const container = document.getElementById('cart-items');
  container.innerHTML = '';
  cart.forEach(id => {
    const ing = getIngredient(id);
    const el = document.createElement('div');
    el.className = 'cart-item';
    el.dataset.id = id;
    el.innerHTML = `<span class="ci-emoji">${ing.emoji}</span><span class="ci-name">${ing.name}</span>`;
    el.addEventListener('click', onCartItemClick);
    container.appendChild(el);
  });
}

function updateCartBadge() {
  const badge = document.getElementById('cart-count');
  if (cart.length > 0) {
    badge.style.display = '';
    badge.textContent = cart.length;
    badge.classList.remove('pop');
    void badge.offsetWidth;
    badge.classList.add('pop');
  } else {
    badge.style.display = 'none';
  }
}

function updateGoHomeBtn() {
  document.getElementById('btn-go-home').disabled = cart.length === 0;
}

// ===== NAVIGATE =====
function goHome() {
  if (cart.length === 0) return;
  saveGameState(money, cart);
  playSound('bell');
  navigateTo('ride.html');
}

// ===== RECIPE BOOK =====
function openRecipeBook() {
  const list = document.getElementById('rb-list');
  list.innerHTML = '';
  for (const recipe of RECIPES) {
    const hasAll = recipe.required.every(id => cart.includes(id));
    const cost = recipe.required.reduce((s, id) => s + getIngredient(id).price, 0);
    const card = document.createElement('div');
    card.className = 'rb-card' + (hasAll ? ' can-make' : '');
    card.innerHTML = `
      <div class="rb-card-emoji">${recipe.emoji}</div>
      <div class="rb-card-info">
        <div class="rb-card-name">${recipe.name}${hasAll ? ' ✅' : ''}</div>
        <div class="rb-card-row"><span class="label">必要:</span>${recipe.required.map(id => {
          const ing = getIngredient(id); const has = cart.includes(id);
          return `<span class="rb-ing ${has ? 'has' : 'missing'}">${has ? '✅' : '⬜'}${ing.emoji}${ing.name}</span>`;
        }).join('')}</div>
        <div class="rb-card-row"><span class="label">可选:</span>${recipe.optional.map(id => {
          const ing = getIngredient(id);
          return `<span class="rb-ing ${cart.includes(id) ? 'has' : 'missing'}">${ing.emoji}</span>`;
        }).join('')}</div>
        <div class="rb-card-cost">必要食材共 ${cost} 元</div>
      </div>`;
    list.appendChild(card);
  }
  document.getElementById('recipe-book-overlay').classList.add('active');
  playSound('bell');
}

function closeRecipeBook() {
  document.getElementById('recipe-book-overlay').classList.remove('active');
}

// ===== UTILS =====
function flashClass(id, cls, ms) {
  const el = document.getElementById(id);
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}
</script>
</body>
</html>
