<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>小厨师做饭 - 超市</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="shop.css">
</head>
<body>

<div class="phase-bar">
  <div class="phase-dot active">🛒 超市</div>
  <div class="phase-connector"></div>
  <div class="phase-dot">🚲 回家</div>
  <div class="phase-connector"></div>
  <div class="phase-dot">🍳 做饭</div>
</div>

<div class="page">
  <div class="shop-header">
    <div class="shop-title">🏪 超市</div>
    <button class="recipe-book-btn" id="btn-recipe">📖 食谱</button>
    <div class="wallet" id="wallet">
      <span class="coin">🪙</span>
      <span id="wallet-amount">20</span> 元
    </div>
  </div>
  <div class="shelves" id="shelves"></div>
  <div class="cart-area" id="cart-area">
    <div class="cart-label">🛒 购物车 <span class="cart-count" id="cart-count" style="display:none">0</span></div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-actions">
      <button class="btn btn-go-home" id="btn-go-home" disabled>🏠 回家做饭！</button>
    </div>
  </div>
</div>

<!-- Recipe book overlay -->
<div class="overlay-backdrop" id="recipe-book-overlay">
  <div class="recipe-book">
    <div class="rb-header">
      <h2>📖 食谱大全</h2>
      <button class="rb-close" id="btn-rb-close">✕</button>
    </div>
    <div class="rb-list" id="rb-list"></div>
  </div>
</div>

<script src="../shared/utils.js"></script>
<script src="shared.js"></script>
<script src="shop.js"></script>
</body>
</html>
