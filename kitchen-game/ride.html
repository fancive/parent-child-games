<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小厨师做饭 - 骑车回家</title>
<link rel="stylesheet" href="shared.css">
<style>
body { background: linear-gradient(180deg, #81d4fa 0%, #b3e5fc 40%, #e1f5fe 100%); }
.page {
  width: 100%; height: 100vh; height: 100dvh;
  overflow: hidden; position: relative;
  padding-top: 0; /* full screen ride */
}

.parallax-layer { position: absolute; left: 0; width: 100%; overflow: hidden; }
.sky-layer { top: 48px; height: 35%; }
.cloud { position: absolute; opacity: 0.7; will-change: transform; }

.building-layer { bottom: 25%; height: 40%; display: flex; align-items: flex-end; }
.building-strip {
  display: flex; align-items: flex-end;
  position: absolute; bottom: 0;
  will-change: transform; white-space: nowrap;
}
.building-obj { font-size: 3rem; line-height: 1; flex-shrink: 0; }

.road-layer {
  bottom: 0; height: 25%;
  background: linear-gradient(180deg, #8d6e63 0%, #6d4c41 20%, #5d4037 100%);
}
.road-strip {
  position: absolute; bottom: 40%; height: 4px;
  display: flex; gap: 30px; will-change: transform;
}
.road-dash {
  width: 40px; height: 4px; background: #fff;
  border-radius: 2px; opacity: 0.5; flex-shrink: 0;
}

.biker {
  position: absolute; bottom: 26%; left: 30%;
  font-size: 3rem; z-index: 10;
}
.biker-body { animation: biker-bounce 0.35s ease-in-out infinite alternate; }
@keyframes biker-bounce { to { transform: translateY(-4px); } }
.shopping-bag {
  position: absolute; top: -10px; right: -15px; font-size: 1.2rem;
  animation: bag-swing 0.5s ease-in-out infinite alternate;
}
@keyframes bag-swing { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

.marker {
  position: absolute; bottom: 26%; font-size: 1.5rem; z-index: 5;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  will-change: transform;
}
.marker-label {
  font-size: 0.7rem; background: rgba(255,255,255,0.9);
  padding: 2px 8px; border-radius: 8px;
  font-weight: 700; color: #333; white-space: nowrap;
}
.home-arrived { animation: home-burst 0.5s ease; }
@keyframes home-burst { 50% { transform: scale(1.5); } }

/* Collectible stars */
.road-star {
  position: absolute; bottom: 30%; font-size: 1.5rem; z-index: 8;
  cursor: pointer; will-change: transform;
  min-width: var(--touch-min); min-height: var(--touch-min);
  display: flex; align-items: center; justify-content: center;
  animation: star-bob 0.8s ease-in-out infinite alternate;
}
@keyframes star-bob { to { transform: translateY(-8px); } }
.road-star.collected {
  animation: star-collect 0.4s ease-out forwards; pointer-events: none;
}
@keyframes star-collect { to { transform: scale(2) translateY(-30px); opacity: 0; } }
</style>
</head>
<body>

<div class="phase-bar">
  <div class="phase-dot done">🛒 超市</div>
  <div class="phase-connector"></div>
  <div class="phase-dot active">🚲 回家</div>
  <div class="phase-connector"></div>
  <div class="phase-dot">🍳 做饭</div>
</div>

<div class="page">
  <div class="sky-layer parallax-layer" id="sky-layer"></div>
  <div class="building-layer parallax-layer">
    <div class="building-strip" id="building-strip"></div>
  </div>
  <div class="road-layer parallax-layer">
    <div class="road-strip" id="road-strip"></div>
  </div>
  <div class="marker" id="marker-start">
    <span>🏪</span><span class="marker-label">超市</span>
  </div>
  <div class="marker" id="marker-end">
    <span id="home-icon">🏠</span><span class="marker-label">我的家</span>
  </div>
  <div class="biker">
    <div class="biker-body">🚲</div>
    <div class="shopping-bag">🛍️</div>
  </div>
</div>

<script src="shared.js"></script>
<script>
// Guard: redirect if no cart
const state = loadGameState();
if (state.cart.length === 0) {
  window.location.replace('index.html');
} else {
  setTimeout(startBikeRide, 250);
}

function startBikeRide() {
  // Clouds
  const skyLayer = document.getElementById('sky-layer');
  const cloudEmojis = ['☁️', '⛅', '🌤️'];
  for (let i = 0; i < 8; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    c.textContent = cloudEmojis[i % 3];
    c.style.top = (10 + Math.random() * 60) + '%';
    c.style.left = (Math.random() * 200) + '%';
    c.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    skyLayer.appendChild(c);
  }

  // Buildings
  const bs = document.getElementById('building-strip');
  '🏠🏡🏢🌳🌲🏪🏫🌳🏠🌲🏬🌳🏡🏠🌲🏢🌳🏠🏡🌳'.match(/./gu).forEach(b => {
    const el = document.createElement('span');
    el.className = 'building-obj'; el.textContent = b;
    bs.appendChild(el);
  });

  // Road dashes
  const rs = document.getElementById('road-strip');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'road-dash'; rs.appendChild(d);
  }

  // Road stars
  const page = document.querySelector('.page');
  const starEmojis = ['⭐', '🌟', '💫'];
  const stars = [];
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'road-star';
    s.textContent = starEmojis[i % 3];
    s.style.left = (20 + i * 15) + '%';
    s.style.animationDelay = (i * 0.15) + 's';
    s.addEventListener('click', () => {
      if (!s.classList.contains('collected')) {
        s.classList.add('collected');
        playSound('bell');
      }
    });
    page.appendChild(s);
    stars.push({ el: s, initPct: 20 + i * 15 });
  }

  const vw = window.innerWidth;
  const markerStart = document.getElementById('marker-start');
  const markerEnd = document.getElementById('marker-end');
  markerStart.style.left = vw * 0.7 + 'px';
  markerEnd.style.left = vw * 2 + 'px';

  playSound('bell');

  const duration = 5500;
  const t0 = performance.now();

  (function tick(now) {
    const p = Math.min((now - t0) / duration, 1);
    const ease = p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;

    skyLayer.querySelectorAll('.cloud').forEach(c => {
      c.style.transform = `translateX(${-ease * vw * 0.4}px)`;
    });
    bs.style.transform = `translateX(${-ease * vw * 1.5}px)`;
    rs.style.transform = `translateX(${-ease * vw * 2.5}px)`;
    markerStart.style.left = (vw * 0.7 - ease * vw * 1.5) + 'px';
    markerEnd.style.left = (vw * 2 - ease * vw * 1.8) + 'px';

    stars.forEach(({ el, initPct }) => {
      el.style.left = `calc(${initPct}% - ${ease * vw * 2}px)`;
    });

    if (p < 1) return requestAnimationFrame(tick);

    // Arrival
    document.getElementById('home-icon').classList.add('home-arrived');
    playSound('fanfare');
    setTimeout(() => navigateTo('kitchen.html'), 900);
  })(performance.now());
}
</script>
</body>
</html>
